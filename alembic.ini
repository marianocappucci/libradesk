# Alembic de LibraDesk. Mismo layout que gestiolibra/alembic.ini
# (script_location = migrations), con dos diferencias que impone SQLite y que
# estan explicadas en migrations/env.py: `render_as_batch` y el `version_table`
# propio.
#
# La url de aca es solo un placeholder para poder correr el CLI a mano
# (`alembic history`, `alembic revision --autogenerate`). En produccion NADIE la
# usa: `app.schema.ensure_schema()` inyecta la conexion ya abierta del engine de
# la app. Ver env.py.
[alembic]
script_location = migrations

# 🔴 **Sin esto el CLI de Alembic no arranca dentro del contenedor.** El deploy
# corre `compose run --rm <instancia> alembic upgrade head` (LibraCore
# `v1.48.0`, ver `migraciones=` en scripts/panel_admin.py), y ahi `alembic` es
# un console script: Python le pone en `sys.path[0]` el directorio del
# ejecutable —`/usr/local/bin`—, NO el directorio de trabajo. El paquete `app`
# se resuelve igual porque esta instalado en site-packages, pero `plans.py` es
# un modulo suelto en la raiz que no se instala, asi que la cadena
# env.py -> app.schema -> app.services.modules -> `from plans import ...`
# muere con `ModuleNotFoundError: No module named 'plans'` y el deploy de esa
# instancia aborta.
#
# El servidor no lo sufria porque `uvicorn` SI agrega el directorio de trabajo
# a `sys.path`; el CLI no. Medido el 2026-08-24 contra la imagen de la demo con
# el comando exacto del deploy: sin esta linea, codigo de salida 1.
prepend_sys_path = .
sqlalchemy.url = sqlite:///data-dev/libradesk.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
