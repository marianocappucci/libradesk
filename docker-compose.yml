x-libradesk-build: &libradesk-build
  context: .
  # Un id SSH por paquete privado, mismo patron que el resto de la
  # familia (ver Dockerfile) — GitHub autentica toda la conexion con la
  # primera deploy key que le ofrecen, asi que una sola key no alcanza
  # si hay mas de una dependencia privada.
  ssh:
    - default=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
    - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
    - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
    - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}

x-libradesk-common: &libradesk-common
  restart: unless-stopped
  mem_limit: 512m
  mem_reservation: 192m
  cpus: 1.0
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  networks:
    - stack-net

services:
  # Instancia de desarrollo/pruebas — dev.libradesk.com.ar
  libradesk-dev:
    <<: *libradesk-common
    build: *libradesk-build
    container_name: libradesk-dev
    ports:
      - "8086:8000"
    volumes:
      - ./data-dev:/app/data
    environment:
      - SECRET_KEY=${DEV_SECRET_KEY:?falta DEV_SECRET_KEY}
      - LIBRADESK_ADMIN_USERNAME=${DEV_ADMIN_USERNAME:-admin}
      - LIBRADESK_ADMIN_PASSWORD=${DEV_ADMIN_PASSWORD:?falta DEV_ADMIN_PASSWORD}
      - DATA_DIR=/app/data
      - ENV=production
      # Recuperacion de contrasena (libraauth v0.5.0). Sin SMTP la app levanta
      # igual y POST /auth/forgot-password devuelve 503: cargar estas
      # variables es lo unico que falta para que mande mails.
      - LIBRADESK_RESET_URL_BASE=${DEV_RESET_URL_BASE:-https://dev.libradesk.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-LibraDesk}

  # Cliente real de produccion — compulibra.libradesk.com.ar
  libradesk-compulibra:
    <<: *libradesk-common
    build: *libradesk-build
    container_name: libradesk-compulibra
    ports:
      - "8087:8000"
    volumes:
      - ./data-compulibra:/app/data
    environment:
      - SECRET_KEY=${COMPULIBRA_SECRET_KEY:?falta COMPULIBRA_SECRET_KEY}
      - LIBRADESK_ADMIN_USERNAME=${COMPULIBRA_ADMIN_USERNAME:-admin}
      - LIBRADESK_ADMIN_PASSWORD=${COMPULIBRA_ADMIN_PASSWORD:?falta COMPULIBRA_ADMIN_PASSWORD}
      - DATA_DIR=/app/data
      - ENV=production
      # El link del mail tiene que apuntar al dominio DE ESTA instancia: si
      # heredara el de dev, el cliente recibiria un enlace a un sistema que no
      # es el suyo (y donde su token no existe).
      - LIBRADESK_RESET_URL_BASE=${COMPULIBRA_RESET_URL_BASE:-https://compulibra.libradesk.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${COMPULIBRA_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${COMPULIBRA_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${COMPULIBRA_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${COMPULIBRA_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${COMPULIBRA_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${COMPULIBRA_SMTP_FROM_NAME:-LibraDesk}

networks:
  stack-net:
    external: true
    name: stack_stack-net
