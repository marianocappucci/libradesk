# Compose de la instancia de DESARROLLO — dev.libradesk.com.ar
#
# Las instancias de cliente NO se declaran aca: cada una vive en su propio
# `clientes/<slug>/docker-compose.yml` (gitignored, solo en el VPS), corriendo
# una imagen ya construida y pineada por version — ver `clientes.example.yml`
# y `scripts/panel_admin.py actualizar <slug>`.
#
# Por que: mientras dev y el cliente compartian este archivo y el mismo
# `build:`, un `git pull` movia el codigo de los dos a la vez y un
# `docker compose build` sin nombrar servicio reconstruia las dos imagenes.
# No habia forma de tocar dev sin dejar la instancia del cliente cargada con
# el codigo nuevo, esperando su proximo arranque. Ahora el cliente corre una
# imagen fija: solo se mueve cuando alguien la construye y la repinea a
# proposito.

x-libradesk-build: &libradesk-build
  context: .
  # Un id SSH por paquete privado, mismo patron que el resto de la
  # familia (ver Dockerfile) — GitHub autentica toda la conexion con la
  # primera deploy key que le ofrecen, asi que una sola key no alcanza
  # si hay mas de una dependencia privada.
  ssh:
    - default=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
    - libraauth=${LIBRAAUTH_SSH_KEY:-~/.ssh/id_ed25519_libraauth}
    - libracore=${LIBRACORE_SSH_KEY:-~/.ssh/id_ed25519_libracore}
    # Sumada con la fase B del pedido 42 (agenda). La clave ya estaba en el
    # VPS —la usan Gestiolibra y MedLibra—; lo que faltaba era declararla aca
    # y en el Dockerfile.
    - libragenda=${LIBRAGENDA_SSH_KEY:-~/.ssh/id_ed25519_libragenda}
    - libra-ui=${LIBRA_UI_SSH_KEY:-~/.ssh/id_ed25519_libra_ui}

x-libradesk-common: &libradesk-common
  restart: unless-stopped
  mem_limit: 512m
  mem_reservation: 192m
  cpus: 1.0
  # 🔴 El chequeo mira el CUERPO, no el codigo HTTP, y no es prolijidad.
  # `app/asgi.py` sirve la SPA en `/{full_path:path}`, asi que **cualquier**
  # ruta devuelve 200 con el index.html mientras haya `dist/` horneado. Un
  # healthcheck que solo llama a `urlopen()` no puede fallar aunque la API
  # este muerta: da healthy igual, y da healthy tambien apuntado a una ruta
  # inventada — o sea que no distingue "app sana" de "app sirviendo
  # estaticos". Medido el 2026-08-12 (ver tests/test_healthcheck_contenedor.py,
  # que lo verifica por rotura contra la app real).
  #
  # `json.load` sobre el index.html revienta con JSONDecodeError, y eso es
  # exactamente lo que se busca: exit != 0 -> unhealthy.
  #
  # ⚠️ La ruta es `/health` desde el 2026-08-12 — la misma que los otros cinco
  # productos. **Requiere una imagen que la sirva** (PR #112 en adelante); con
  # una anterior, este chequeo cae en el catch-all de la SPA y el contenedor
  # queda unhealthy para siempre. O sea: recrear con `--build`, o verificar
  # antes que la imagen tenga la ruta. La ruta vieja `/api/health` era un alias
  # de transicion y ya NO existe: pedirla hoy no da 404, la contesta el
  # catch-all con un 200 y HTML.
  healthcheck:
    test: ["CMD", "python3", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); assert json.load(r)['status'] == 'ok'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  # `stack-net` es la red compartida de todo el stack: la necesita la APP para
  # que el proxy la alcance por nombre. `datos` es la red de ESTA instancia, y
  # es la unica donde vive el sidecar — ver la estrofa `networks:` del final.
  networks:
    - stack-net
    - datos

services:
  # El backend de la instancia de dev desde el corte del 2026-08-09. Dejo de
  # ser "descartable con --profile": si no esta arriba, dev no tiene base.
  #
  # 🔴 La clave del servicio es `libradesk-postgres` y no `db` ni `postgres`
  # A PROPOSITO. `stack-net` es una red COMPARTIDA por todos los productos del
  # VPS, y Compose convierte la clave del servicio en un alias de red: dos
  # composes con la misma clave se turnan por round-robin del DNS interno. Ya
  # paso en esta familia — `sistema.contalibra.com.ar` alterno entre el sistema
  # de un cliente y el auto-login de una demo.
  #
  # Sin `ports:` a proposito: solo se llega desde la red interna. Para mirarla
  # desde afuera, tunel SSH — publicar 5432 en un VPS es publicarla a Internet.
  libradesk-postgres:
    image: postgres:16-alpine
    container_name: libradesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libradesk
      POSTGRES_USER: libradesk
      # Sin default a proposito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave que esta escrita en git. Se define en
      # el `.env` del VPS, que no se versiona.
      POSTGRES_PASSWORD: ${LIBRADESK_DEV_DB_PASSWORD:?falta LIBRADESK_DEV_DB_PASSWORD en .env}
    volumes:
      - libradesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libradesk -d libradesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # SOLO `datos`. Fuera de la red compartida a proposito: en `stack_stack-net`
    # conviven ~40 contenedores, asi que cualquier app de otro producto llegaba
    # a esta base y lo unico que separaba era la contraseña. Medido el
    # 2026-08-11 — ver la pagina de la migracion a PostgreSQL en el wiki.
    networks:
      - datos

  # Instancia de desarrollo/pruebas — dev.libradesk.com.ar
  libradesk-dev:
    <<: *libradesk-common
    build: *libradesk-build
    container_name: libradesk-dev
    depends_on:
      libradesk-postgres:
        condition: service_healthy
    ports:
      - "8086:8000"
    volumes:
      # El `.db` se sigue montando DESPUES del corte a PostgreSQL, y no es un
      # descuido: ahi viven los logos, los backups y el `.db` anterior, que es
      # el rollback. Volver a SQLite es sacar `DATABASE_URL` y reiniciar.
      - ./data-dev:/app/data
    environment:
      - SECRET_KEY=${DEV_SECRET_KEY:?falta DEV_SECRET_KEY}
      - LIBRADESK_ADMIN_USERNAME=${DEV_ADMIN_USERNAME:-admin}
      - LIBRADESK_ADMIN_PASSWORD=${DEV_ADMIN_PASSWORD:?falta DEV_ADMIN_PASSWORD}
      - DATA_DIR=/app/data
      # 🔴 El corte a PostgreSQL (2026-08-09). Sacar esta linea y reiniciar es
      # el rollback completo: el `.db` de `data-dev/` sigue ahi y sin tocar.
      # El host es la clave del servicio, que en esta red compartida es un
      # alias publico — ver el comentario de `libradesk-postgres`.
      - DATABASE_URL=postgresql+psycopg://libradesk:${LIBRADESK_DEV_DB_PASSWORD:?falta LIBRADESK_DEV_DB_PASSWORD}@libradesk-postgres:5432/libradesk
      # Secreto compartido con la landing para validar el login de /docs/. Sin
      # el, el endpoint de verify falla cerrado y el login dice "usuario o
      # contrasena incorrectos" aunque esten bien.
      #
      # Estaba SOLO en el compose del VPS, con el valor escrito adentro y sin
      # commitear — la unica deriva local que tenia ese archivo, y la que hizo
      # conflicto al traer esta rama el 2026-08-09. El valor ya vivia tambien
      # en el `.env`, asi que se referencia desde ahi y el compose del VPS
      # queda sin cambios locales.
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:?falta DOCS_AUTH_SECRET}
      - ENV=production
      # Recuperacion de contrasena (libraauth v0.5.0). Sin SMTP la app levanta
      # igual y POST /auth/forgot-password devuelve 503: cargar estas
      # variables es lo unico que falta para que mande mails.
      - LIBRADESK_RESET_URL_BASE=${DEV_RESET_URL_BASE:-https://dev.libradesk.com.ar/reset-password}
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-LibraDesk}

networks:
  stack-net:
    external: true
    name: stack_stack-net
  datos:
    name: libradesk-dev-datos

volumes:
  libradesk-postgres-data:
