[project]
name = "libradesk"
version = "0.1.0"
description = "Sistema de tickets IT — clientes, equipos, incidencias."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    # Driver para el backend PostgreSQL del dominio SQLAlchemy. SQLite sigue
    # siendo válido durante la transición y no requiere dependencia extra.
    "psycopg[binary]>=3.2",
    # Runtime, no dev: las migraciones corren en el arranque de la app
    # (app/schema.py), no en un paso aparte del deploy. Un contenedor sin
    # alembic no levanta.
    "alembic>=1.13",
    "itsdangerous>=2.2.0",
    # Directa desde que la configuracion de facturacion cifra las credenciales
    # en reposo (`app/services/facturacion_config.py`). Ya venia como
    # transitiva, pero de eso no se puede depender: si la dependencia que la
    # arrastraba deja de necesitarla, el import revienta en produccion.
    "cryptography>=42.0",
    "openpyxl>=3.1.0",
    # v0.8.0 trae el log de accesos (`libraauth.auth_events`), v0.9.0 el de
    # actividad (`libraauth.auditoria`) y v0.10.0 el router que los lee — los
    # tres extraidos de este mismo producto para que los otros no los copien.
    # El bump NO es opcional a partir de aca: `main.py` importa de los tres,
    # asi que con un pin anterior la app ni siquiera levanta.
    #
    # v0.12.0: un cambio que solo toca columnas ocultas deja fila igual, con el
    # valor tapado. Antes se descartaba entero — o sea que cambiar SOLO la
    # contrasena de un usuario no dejaba rastro en el log de este producto.
    #
    # v0.21.0: el `server_default` de `auth_log.ts` era
    # `datetime('now','localtime')` —SQLite puro— y contra PostgreSQL el
    # CREATE TABLE muere con "function datetime(unknown, unknown) does not
    # exist", o sea que la instancia no arranca. Ahora se emite por dialecto
    # con una `FunctionElement`: en SQLite el DDL no cambia un byte, en
    # PostgreSQL sale `LOCALTIMESTAMP`. No se pudo usar `func.now()` porque esa
    # tabla la escriben DOS lados —el ORM de LibraAuth y un INSERT crudo de
    # `libracore.db.logs` que se apoya en el DEFAULT— y en SQLite `func.now()`
    # es UTC, lo que dejaria medio log tres horas corrido.
    #
    # (Ese tag salia de `feature/compatibilidad-postgres`, la rama que este pin
    # consumia durante el piloto: ya esta mergeada a `develop` y publicada.)
    #
    # v0.24.0 trae el arreglo del diff de auditoria: recorre `column_attrs` y
    # lee por atributo, en vez de buscar nombres de COLUMNA en un indice por
    # ATRIBUTO. Este producto es el primero de la familia donde los dos nombres
    # diferen --el modelo de clientes de la revision `0017` mapea `nombre` a la
    # columna `name`-- y sin el arreglo el PUT y el desactivar dan 404: el log
    # se escribe en la misma transaccion que la operacion, asi que el KeyError
    # no perdia una linea de log, se llevaba puesta la operacion entera.
    #
    # v0.38.0 -> v0.40.0 (2026-09-12): el captcha ALTCHA del login y del
    # forgot-password (`build_json_api_auth_router(captcha=True)`, ADR-014 de
    # libraauth) --arrastra `altcha` como transitiva--. Y de paso v0.39.0, que
    # arregla la IP con que cuenta el bloqueo por intentos (`ip_del_request`).
    # **El bump NO es opcional a partir de aca**: `app/routers/auth.py` pasa
    # `captcha=True`, y con un pin anterior el router ni se construye.
    #
    # v0.40.0 -> v0.43.1 (2026-09-14, ADR-018): `libraauth.usuarios.
    # build_users_router()`, el router de usuarios unico de la familia --
    # reemplaza la copia propia de `app/routers/users.py` (ver ese archivo).
    # Trae ademas la sesion de 8h con renovacion deslizante (ADR-017): llega
    # sola con este bump porque `app/auth.py` re-exporta las dependencias de
    # `libraauth.session_auth` sin envolverlas.
    #
    # v0.48.0 -> v0.49.0 (2026-10-12, ADR-022): `registrador_dbapi`, el segundo camino del log de actividad. Es lo que deja que el CRUD de clientes pase por `libracore.db.clients` sin perder la auditoria (ADR-013 de este repo). Sin migracion.
    # v0.49.0 -> v0.50.0 (2026-10-13, ADR-023): `UsadosEnBase`, el anti-replay del captcha en la base (varios procesos). **Con migracion** (`0003_captcha_usados`): el arranque la exige (`exigir_schema_al_dia`), asi que `libraauth-migrar upgrade` corre antes de uvicorn.
    # v0.50.0 -> v0.51.0 (2026-10-15, ADR-024): aceptar la proxima version de los Terminos por adelantado (`proxima` en GET /terminos). Sin migracion.
    # v0.52.0 -> v0.53.0 (2026-10-20): la marca Secure de la cookie de sesion es configurable (LIBRAAUTH_COOKIE_SECURE, ADR-026); sin la variable no cambia nada. Sin migracion.
    # v0.53.0 -> v0.54.0 (2026-10-21): en un nodo de LibraEdge los usuarios son los del central (ADR-027); fuera de un nodo no cambia nada. Sin migracion.
    # v0.54.0 -> v0.55.0 (2026-10-21): en un nodo de LibraEdge no se pide captcha y la IP del bloqueo es el par directo (ADR-028); fuera de un nodo no cambia nada. Sin migracion.
    "libraauth[migrations] @ git+https://github.com/marianocappucci/libraauth.git@v0.55.0",
    # Remitos y presupuestos: se reusa el dominio completo de LibraCore
    # (libracore.db.remitos_presupuestos, ~20 funciones) y sus PDF
    # (RemitoPDF / PresupuestoPDF), en vez de escribir nada nuevo. Arrastra
    # fpdf2, qrcode, Pillow, cryptography y jinja2 como transitivas.
    # v1.7.0 trae el arreglo del PDF: hasta v1.6.0 un guion largo en el nombre
    # de empresa, en un item o en las observaciones tumbaba la generacion con un
    # 500 (libracore PR #6). La superficie de libracore que toca a este producto
    # no cambio entre v1.6.0 y v1.7.0: el unico delta es ese fix.
    #
    # v1.8.0 trae la maqueta compacta (libracore PR #8): membrete 51,5 -> 40,3 mm
    # y tarjetas Emisor/Cliente 65 -> 50,6 mm, con lo que un presupuesto pasa de
    # 6 a 10 items en la primera hoja y un remito de 10 a 13. **Cambia el
    # aspecto** de los comprobantes que emite este producto -- es el motivo del
    # bump, no un efecto lateral. Sin campos eliminados ni tipografias mas
    # chicas. El delta v1.6.0..v1.8.0 son exactamente esos dos commits, los dos
    # en los generadores de PDF: `libracore.db` y `provisioning`, que este
    # producto tambien usa, no se tocaron.
    #
    # v1.9.1 arregla un defecto que **reporto el usuario sobre este producto**
    # (libracore PR #14): el titulo del membrete se dibujaba con un `cell()`,
    # que no envuelve, asi que un titulo mas ancho que su celda de 38 mm se
    # salia del recuadro. Con los titulos cortos de facturacion no se notaba
    # (Remito 10,2 mm; Factura 10,8; Presupuesto 18,2); los dos comprobantes
    # del pedido 43 miden 55,8 y 51,8, y se pasaban 17,8 y 13,8 mm. Ahora la
    # fila de la letra crece un renglon **solo si hace falta**, asi que los
    # comprobantes de una linea de este producto no se mueven.
    #
    # El salto v1.8.0 -> v1.9.1 arrastra tambien v1.9.0 (recibos). Se midio
    # antes de subirlo y es seguro por dos motivos:
    #   - Todo lo que cambio en `pdf_generator.py` entre v1.8.0 y v1.9.0 esta
    #     dentro de `generate_pdf_recibo`, que este producto no usa; y los 13
    #     nombres privados que importa (`_draw_header_block`, `_wrap_text`,
    #     `_TextoSeguroPDF`, ...) siguen existiendo -- hay un test que lo fija.
    #   - `libracore/db/schema.py` crecio, pero **el DDL de `remitos` y
    #     `presupuestos` no se movio**, que es el que este producto copia a mano
    #     en `services/remitos_presupuestos.py`. Era el riesgo real del bump.
    #
    # v1.11.0 -> v1.13.0 (2026-08-05, item 2 de los pendientes de Libra). Los
    # dos saltos salen de este pedido y **este producto es el unico consumidor
    # que los ejercita**:
    #   - v1.12.0: el presupuesto que mezcla alicuotas no inventa un porcentaje
    #     en el total, y muestra la columna de IVA por linea.
    #   - v1.13.0: `generate_pdf_presupuesto(..., discriminar=)`, para que el
    #     comprobante de quien no computa credito fiscal salga con el precio
    #     final en vez del desglose.
    # Los dos tienen el comportamiento viejo como default, asi que un
    # comprobante de una sola alicuota para un Responsable Inscripto sale
    # identico a como salia con v1.11.0. El DDL de `remitos` y `presupuestos`
    # —el riesgo real de cualquier bump acá— no se movio en ninguno de los dos.
    # v1.16.0: la capa dual SQLite/PostgreSQL. `configure()` acepta una URL
    # PostgreSQL y un wrapper de Connection/Cursor traduce paramstyle, emula
    # `sqlite3.Row`, convierte `lastrowid` en `RETURNING id` y traduce el DDL y
    # las funciones de SQLite. Es lo que permite que este producto lea remitos
    # y presupuestos contra PostgreSQL — hasta v1.15.0, 5 de las 7 lecturas de
    # `remitos_presupuestos` fallaban ahi (`dict(fila)` sin `keys()`,
    # `ROUND(x,n)` sobre double precision, `text < date`, y `created_at` con
    # microsegundos y zona). Ver `tests/test_remitos_postgres.py`.
    #
    # Para SQLite el unico cambio de comportamiento es el `HAVING` del reporte
    # de stock bajo, que vuelve a comparar el valor REDONDEADO — o sea que
    # restaura lo de v1.15.0, no lo cambia. Este producto no usa ese reporte.
    #
    # v1.16.0 -> v1.17.0: `Instancia.postgres_url`. **El bump NO es opcional a
    # partir de aca**: `main.py` le pasa ese argumento a `Instancia` y con
    # v1.16.0 la app ni arranca (`TypeError: unexpected keyword argument`,
    # verificado). Es lo que hace que el backup de una instancia PostgreSQL
    # traiga la base: hasta v1.16.0 el ZIP salia con los logos y sin datos, sin
    # ningun error. Requiere `pg_dump`/`pg_restore` en la imagen — ver el
    # Dockerfile.
    #
    # v1.18.0: aplicar un plan de modulos contra PostgreSQL. `apply_plan_modules`
    # abria su propio `sqlite3`, asi que contra una instancia PostgreSQL creaba
    # un archivo vacio al lado y moria con `no such table: modulos` — el plan
    # NO se aplicaba y la instancia quedaba con los modulos como vinieran. Trae
    # ademas dos arreglos del adaptador que salieron de ahi (`RETURNING id`
    # sobre una tabla sin `id`, y un entero en una columna BOOLEAN) y
    # `libracore.db.core.conectar()`, que abre contra cualquiera de los dos
    # motores sin estado global.
    #
    # v1.29.0 -> v1.31.0 (2026-08-12). Son dos, y las dos pegan aca:
    #
    # - v1.30.0: un comprobante se fecha con SU fecha y no con el reloj, asi que
    #   reimprimirlo da byte a byte el mismo archivo. Aplica a lo que sale por
    #   los generadores compartidos: remitos (`generate_pdf`) y presupuestos
    #   (`generate_pdf_presupuesto`). Los PDF propios de este repo —incidencia,
    #   ingreso, informe— NO: heredan de `_TextoSeguroPDF` pero arman su
    #   maqueta, y nadie les llama `fijar_fecha_documento()`, asi que se siguen
    #   fechando con el reloj. Si se quiere la misma propiedad, es esa llamada.
    # - v1.31.0: `pinear_image` escribia la imagen de la app en el primer
    #   `image:` del compose. **El layout de este repo es el que lo destapo**:
    #   `libradesk-postgres` (con `image: postgres:16-alpine`) va declarado
    #   ANTES que `libradesk-dev`, y en un deploy real PostgreSQL arranco
    #   corriendo la app. Ahora el servicio se elige por `container_name`.
    #
    # v1.33.0 -> v1.34.0: **el bump NO es opcional a partir de aca.**
    # `app/services/clientes.py` importa `validar_cuit_no_duplicado()` y el
    # modelo vive sobre la tabla `clients` con las cuatro columnas de la
    # revision `0002` (`empresa`, `ciudad`, `observaciones`,
    # `tipo_facturacion`). Con un pin anterior a `v1.33.0` ese import no existe
    # y la app ni arranca.
    #
    # Las dos cosas ya venian desde `v1.33.0`; se pineo `v1.34.0` porque era la
    # mas nueva y suma el arreglo de `migrar_instancias.sh` --que este producto
    # no consume como libreria, pero es el paso de deploy que aplica las
    # migraciones del motor a las instancias--.
    #
    # v1.34.0 -> v1.37.0 (2026-08-14): los PDF no se salen del marco del papel.
    # Lo que le llega a ESTE repo, que el arreglo local no podia dar:
    #
    # - `_wrap_text` parte por caracter la palabra que no entra en el renglon.
    #   Un texto sin espacios --un serial pegado, una URL-- volvia entero y
    #   `cell` lo dibujaba: medido, 536 mm de borde derecho en una hoja de 210.
    #   El informe de servicio dependia de esto y no tenia como taparlo solo.
    # - El margen del marco lo pone `_TextoSeguroPDF`, asi que un documento
    #   nuevo de este repo ya no puede olvidarselo. Las tres clases de aca lo
    #   fijan igual, a proposito, para no depender del pin.
    #
    # Los cinco comprobantes de LibraCore salen byte por byte identicos a como
    # salian (sha256 comparado), asi que el bump no cambia nada de lo emitido.
    #
    # v1.37.0 -> v1.38.0 (2026-08-14): las filas meta del membrete tambien se
    # recortan. La caja del valor mide ~31 mm --unos 25 caracteres a 7 pt-- y
    # `cell` no recorta: lo que se pasa se dibujaba afuera del papel. El unico
    # documento que mete texto libre ahi es el RECIBO, que pone el concepto en
    # ("Comprobante:", ref_line). Medido en la demo de VentaLibra: "Pago a
    # cuenta en cuenta corriente" terminaba en 202,2 mm en una hoja de 210.
    #
    # Es anterior a v1.37.0 y aquel arreglo no lo cubria.
    # v1.141.0 -> v1.142.0 (2026-10-07): credenciales y estado de ARCA por servicio web (`wscpe`, CTG y Carta de Porte); la facturacion no cambia. Migracion 0022 (tabla nueva `arca_credenciales_servicio`).
    # v1.142.1 -> v1.143.0 (2026-10-07): suma libracore.arca_wscpe (lectura de la Carta de Porte de ARCA, ADR-034); este producto no lo usa. Sin migracion.
    # v1.143.0 -> v1.144.0 (2026-10-08): suma la emision de la Carta de Porte (libracore.arca_wscpe, ADR-035); este producto no la usa. Sin migracion.
    # v1.144.0 -> v1.145.0 (2026-10-08): suma geografia.localidad(id) y GET /api/geo/localidades/{id}; este producto no los usa. Sin migracion.
    # v1.145.0 -> v1.146.0 (2026-10-08): el catalogo geografico suma el resto del Mercosur (geografia.paises, parametro pais; por omision Argentina). Sin migracion.
    # v1.146.0 -> v1.147.0 (2026-10-08): el pedido de certificado de ARCA se genera en el servidor (ADR-036 de libracore: rutas `.../pedido`; `GET .../servicios` suma `admite_pedido`). Sin migracion.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.148.0 -> v1.149.0 (2026-10-09): en una demo (`DEMO_MODE=1`) la empresa es siempre ficticia: `config_manager.load()` pisa los datos de la empresa y `resolve_logo_path()` solo devuelve el logo de demo (ADR-038 de libracore). Fuera de una demo no cambia nada. Sin migracion.
    # v1.149.0 -> v1.150.0 (2026-10-09): `libracore-demo-codigos` (ADR-039): el reset de la demo guarda y devuelve los codigos de acceso. Sin migracion.
    # v1.150.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    # v1.152.0 -> v1.153.0 (2026-10-10): sucursales contratadas y abono por unidad adicional (`libracore.limites` y `libracore.abono`, ADR-041). Sin dato de sucursales contratadas no limita nada; este producto no lo usa. Sin migracion.
    # v1.153.0 -> v1.154.0 (2026-10-12): `libracore.cuit.solo_digitos` y se retira `cc_resumen` (codigo muerto, nadie lo usaba). Sin migracion.
    # v1.154.0 -> v1.155.0 (2026-10-12): migracion 0024 retira cc_resumenes_enviados y clients.cc_resumen_* (ADR-042). Desplegar el producto ANTES de migrar.
    # v1.155.0 -> v1.157.0 (2026-10-12): `libracore.auditoria` y `crear_cliente`/`actualizar_cliente` (ADR-043): el CRUD de clientes de este producto pasa por el motor y el motor avisa cada escritura al registrador de libraauth (ADR-013 de este repo). `actividad_log` entra a `/api/logs` solo, pero este producto monta el router de libraauth, que ya la lee. Sin migracion. (La v1.156.0 es un tag erroneo: no usar.)
    # v1.157.0 -> v1.159.0 (2026-10-13): varios procesos (ADR-044: `libracore.candados`, la nota de credito con `conn=`) y el registro de errores (ADR-045: `libracore.errores.instalar_registro_de_errores`, `POST /api/errores-cliente`). Sin migracion. (La v1.156.0 es un tag erroneo: no usar.)
    # v1.159.0 -> v1.162.0 (2026-10-13): concepto sin «Factura» doble con migracion 0025 (corre al migrar, backup antes), alta por CLI con aviso de casilla y `panel_admin casilla`, se retira `get_cc_movimientos_periodo` y los adicionales quedan fuera de la escalera de planes (ADR-048, sin migracion).
    # v1.163.0 -> v1.164.0 (2026-10-14): cada envio por mail de un comprobante o un presupuesto deja rastro (`envios_email`, ADR-050 de libracore): `GET .../{id}/envios`, `envios_email` en el detalle y `envio_email` en el listado. **Migracion `0026_envios_email`** (tabla nueva) en la cadena de `libracore-migrar`.
    # v1.164.0 -> v1.166.0 (2026-10-14): incluye v1.165.0 (un proceso sin el almacen de secretos dice la causa) y `GET /api/facturas?envio=enviada|sin_enviar` filtra el listado por el rastro de envios por mail (ADR-051 de libracore). Sin migracion.
    # v1.167.0 -> v1.168.0 (2026-10-15, propuesta; ADR-053 de libracore): `libracore.docs_api.cerrar_docs_de_la_api`: `/docs`, `/redoc` y `/openapi.json` sólo con `ENV=development` (o `LIBRA_DOCS_API=1`); en un cliente real y en la demo dan 404. Sin migracion. `uv.lock` se regenera cuando exista el tag.
    # v1.168.0 -> v1.170.0 (2026-10-15; ADR-056 y ADR-057 de libracore): `fk_de_producto.soltar_fk` (lo usa ensure_schema, ADR-016) y `delete_client` bloquea la baja con cuenta corriente. Sin migracion.
