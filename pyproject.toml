[project]
name = "libradesk"
version = "0.1.0"
description = "Sistema de tickets IT — clientes, equipos, incidencias."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.0",
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.1.0",
    # Remitos y presupuestos: se reusa el dominio completo de LibraCore
    # (libracore.db.remitos_presupuestos, ~20 funciones) y sus PDF
    # (RemitoPDF / PresupuestoPDF), en vez de escribir nada nuevo. Arrastra
    # fpdf2, qrcode, Pillow, cryptography y jinja2 como transitivas.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v0.30.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
