[project]
name = "libradesk"
version = "0.1.0"
description = "Sistema de tickets IT — clientes, equipos, incidencias."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    # Runtime, no dev: las migraciones corren en el arranque de la app
    # (app/schema.py), no en un paso aparte del deploy. Un contenedor sin
    # alembic no levanta.
    "alembic>=1.13",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.0",
    # v0.8.0 trae el log de accesos (`libraauth.auth_events`): la mitad de
    # acceso de la pantalla de Logs. El bump NO es opcional para este producto
    # a partir de esta version — `main.py` importa `AuthEventRepository`, asi
    # que con v0.7.0 la app ni siquiera levanta.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.8.0",
    # Remitos y presupuestos: se reusa el dominio completo de LibraCore
    # (libracore.db.remitos_presupuestos, ~20 funciones) y sus PDF
    # (RemitoPDF / PresupuestoPDF), en vez de escribir nada nuevo. Arrastra
    # fpdf2, qrcode, Pillow, cryptography y jinja2 como transitivas.
    # v1.7.0 trae el arreglo del PDF: hasta v1.6.0 un guion largo en el nombre
    # de empresa, en un item o en las observaciones tumbaba la generacion con un
    # 500 (libracore PR #6). La superficie de libracore que toca a este producto
    # no cambio entre v1.6.0 y v1.7.0: el unico delta es ese fix.
    #
    # v1.8.0 trae la maqueta compacta (libracore PR #8): membrete 51,5 -> 40,3 mm
    # y tarjetas Emisor/Cliente 65 -> 50,6 mm, con lo que un presupuesto pasa de
    # 6 a 10 items en la primera hoja y un remito de 10 a 13. **Cambia el
    # aspecto** de los comprobantes que emite este producto -- es el motivo del
    # bump, no un efecto lateral. Sin campos eliminados ni tipografias mas
    # chicas. El delta v1.6.0..v1.8.0 son exactamente esos dos commits, los dos
    # en los generadores de PDF: `libracore.db` y `provisioning`, que este
    # producto tambien usa, no se tocaron.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.8.0",
    # LibraGenda se usa como **libreria de reglas, no de persistencia**: de
    # todo el motor este producto importa `find_conflicts`, que es una
    # funcion pura sobre objetos `Appointment`. No se corren sus migraciones
    # ni viven sus 11 tablas en este SQLite. Ver services/agenda.py.
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "pytest>=8.0",
    "httpx>=0.27",
    # Solo para tests: leer de vuelta el texto de los PDF del informe. Sin
    # esto el unico chequeo posible es la firma `%PDF-`, que un documento
    # vacio o con los datos equivocados pasa igual — mismo motivo por el que
    # los reportes xlsx se verifican abriendolos con openpyxl y no mirando el
    # content-type.
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",    # el archivo no parsea, o error de IO al leerlo
    "F63",   # comparaciones invalidas (`is` contra un literal, `in` mal usado)
    "F7",    # `break` / `continue` / `return` fuera de lugar
    "F811",  # redefinicion de un nombre ya definido o importado
    "F821",  # nombre no definido -> NameError seguro en runtime
    "F822",  # nombre listado en __all__ que no existe en el modulo
    "F823",  # variable local usada antes de asignarse
    "F841",  # variable asignada y nunca usada (codigo muerto)
    "F541",  # f-string sin placeholders (suele ser llaves olvidadas)
    "F502", "F506", "F522", "F524",  # %/format() con argumentos mal armados
    "F601", "F602",                  # `x in 1, 2` en vez de `x in (1, 2)`
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo media el 2026-07-31 (81%), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 79
