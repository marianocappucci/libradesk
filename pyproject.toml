    # v1.185.0 -> v1.186.0 (2026-10-19): facturar en el nodo de LibraEdge con ticket prestado por el central y bandeja al volver (ADR-074). Sin migracion.
    # v1.186.0 -> v1.186.1 (2026-10-19): la bandeja no deja descartar a mano una venta del nodo (completa ADR-074). Sin migracion.
    # v1.186.1 -> v1.186.2 (2026-10-19): el motor se puede importar en Windows (bloqueo de archivo portable, nodo de LibraEdge). Sin migracion.
    # v1.186.2 -> v1.187.0 (2026-10-20): la barra de estado del pie, `GET /api/estado-del-sistema` (ADR-075). Sin migracion.
    # v1.187.0 -> v1.188.0 (2026-10-21): ganchos de caja para que la caja del nodo suba al central (ADR-076). Migracion 0028 aditiva (origen/origen_id).
    # v1.188.0 -> v1.189.0 (2026-10-21): altas de clientes en un nodo: id provisorio y gancho al crear (ADR-077). Sin migracion.
    # v1.189.0 -> v1.190.0 (2026-10-22): libracore-unir-bases para unir la base core dentro de la del dominio (ADR-078). Sin migracion.
    # v1.190.0 -> v1.190.1 (2026-10-22): LibraCargo y LibraClub en _UNA_SOLA_BASE (ADR-078). Sin migracion.
    # v1.190.1 -> v1.191.0 (2026-10-23): cola de comprobantes del nodo offline (cola_arca, ADR-079). Migracion 0029 aditiva.
    # v1.191.0 -> v1.192.0 (2026-10-24): costuras de caja: corregir, extra y gancho del central (ADR-080). Sin migracion.
    # v1.192.0 -> v1.192.1 (2026-10-24): un ciclo con el candado del esquema da deadlock en 1 s, no a los 120 s (ADR-081). Sin migracion.
    # v1.192.1 -> v1.194.0 (2026-10-25): unir-bases con libraauth en el core (ADR-082), GestioLibra y MedLibra de una sola base y tabla de modulos del producto (ADR-083). Sin migracion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.194.0",
    # Stock de consumibles. Este producto NO tenia stock de ninguna clase --sus
    # `depositos` guardan unidades serializadas, no existencias-- y la decision
    # del 2026-08-11 fue **adoptar el motor** que ya usan Contalibra, Restolibra
    # y VentaLibra, en vez de construirle un inventario propio. Comparte la base
    # y la conexion de libracore, igual que remitos/presupuestos.
    #
    # v0.7.2 trae la transferencia entre depositos atomica y con guarda de
    # disponibilidad, que es el caso central de este producto: el deposito
    # central que abastece la camioneta del tecnico.
    #
    # v0.16.4 -> v0.63.0 (2026-10-16): 47 versiones de salto. Lo que este producto usa del motor es el repositorio
    # (`SqliteCommerceRepository`), `usecases.inventory/sales/purchasing` y `erp.ventas.repuntar_fk_ventas_pagos`; el resto
    # (capa `erp` y `web`) no lo monta. Cambia de conducta (ADR-051): el deposito por defecto no se guarda inactivo, y
    # `confirm_sale`, `confirm_purchase_receipt` y `transfer_stock` rechazan un deposito inexistente o inactivo antes de
    # escribir (`DepositoInexistente`, un `ValueError`: los routers ya contestan 422). `repo.transaction()` pasa a ser
    # reentrante (ADR-031) y `init_schema()` suma la tabla `branches` y toma el candado del esquema en PostgreSQL (ADR-062;
    # pide libracore>=1.168). **Migraciones de `libracommerce-migrar`: 0002 a 0007**, todas aditivas (columnas NULL o con DEFAULT
    # en `catalog_items`, un indice en `stock_movements`, `purchase_receipts.clave_operacion` e indice unico parcial, y las tablas
    # vacias `item_branch_min_stock` y `sale_service_returns`); no tocan una fila. `usecases.sales.return_sale_items` se retira
    # (ADR-053; este producto no lo usa). Ensayo con datos ficticios: conteos y md5 iguales antes y despues.
    # v0.63.0 -> v0.64.0 (2026-10-17): `anular_venta` resta lo que las notas de credito ya devolvieron o dejaron a favor (ADR-064). Sin migracion.
    # v0.64.0 -> v0.65.0 (2026-10-18): el reloj de hora.py sale de libracore.fechas (ADR-065; pide libracore>=1.182). Sin migracion.
    # v0.65.0 -> v0.66.0 (2026-10-18): los reportes por dia leen el dia de Argentina; se sigue guardando el instante UTC (ADR-066). Sin migracion.
    # v0.66.0 -> v0.68.0 (2026-10-19): ventas de la capa ERP en un nodo offline (ADR-067) y venta.facturada con reconciliacion (ADR-068). Sin migracion.
    # v0.68.0 -> v0.69.0 (2026-10-21): la caja y los turnos del nodo suben al central (ADR-069). Sin migracion.
    # v0.69.0 -> v0.70.0 (2026-10-21): cliente.alta: las altas de clientes del nodo suben al central (ADR-070); incluye v0.69.1 (cerrar_turno con ganchos). Sin migracion.
    # v0.70.0 -> v0.70.1 (2026-10-21): el central recalcula el arqueo del turno como el nodo (ventas o caja); ya no marca [REVISAR ARQUEO] siempre en ContaLibra y RestoLibra. Sin migracion.
    # v0.70.1 -> v0.71.0 (2026-10-22): el stock de un nodo de LibraEdge (ADR-071): ganchos del ledger, guarda de sucursales con nodo, stock.movimiento y compra.recibida. Migracion 0008 aditiva (stock_movements.origen/origen_id); fuera de un nodo no cambia nada.
    # v0.71.0 -> v0.72.0 (2026-10-22): en un nodo de LibraEdge el deposito por defecto es el de su sucursal. Migracion 0009 aditiva (nodo_local); fuera de un nodo no cambia nada.
    # v0.72.0 -> v0.72.1 (2026-10-22): la carga inicial lleva a cero los depositos ajenos del nodo (PC que cambia de sucursal). Sin migracion.
    # v0.72.1 -> v0.73.0 (2026-10-23): el vinculo del producto viaja con la venta del nodo (ADR-072). Migracion 0010 aditiva (venta_origen_nodo).
    # v0.73.0 -> v0.73.1 (2026-10-24): serializar_esquema toma antes el candado del core (ADR-073). Sin migracion.
    "libracommerce[migrations] @ git+https://github.com/marianocappucci/libracommerce.git@v0.73.1",
    # LibraGenda se usa como **libreria de reglas, no de persistencia**: de
    # todo el motor este producto importa `find_conflicts`, que es una
    # funcion pura sobre objetos `Appointment`. No se corren sus migraciones
    # ni viven sus 11 tablas en este SQLite. Ver services/agenda.py.
    "libragenda @ git+https://github.com/marianocappucci/libragenda.git@v0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13",
    "pytest>=8.0",
    # F3 (2026-09-05): la suite corre en 4 workers en el CI. Medido: 757 s -> 357 s.
    "pytest-xdist>=3.8",
    "httpx>=0.27",
    # Solo para tests: leer de vuelta el texto de los PDF del informe. Sin
    # esto el unico chequeo posible es la firma `%PDF-`, que un documento
    # vacio o con los datos equivocados pasa igual — mismo motivo por el que
    # los reportes xlsx se verifican abriendolos con openpyxl y no mirando el
    # content-type.
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

# 🔴 TRINQUETE, no "reglas que no importan". Cada linea lleva la cuenta del
# dia que se unifico el regimen: la lista SOLO se achica, y lo que no esta
# aca ya no puede entrar en codigo nuevo. Los casos auto-corregibles
# (orden de imports y modernizacion) se arreglaron en el mismo commit.
ignore = [
    "B904",      # 208 caso(s): `raise ... from err` dentro de un except. Ruff NO tiene fix, ni
              #   siquiera unsafe: son a mano, una por una.
    "F401",      # 64 caso(s): import sin usar. 🔴 NO se auto-corrige a proposito: de los 430
              #   de la familia, 168 son RE-EXPORTS —`scripts/panel_admin.py`
              #   re-exporta 27 nombres que `libracore.admin.services` usa como
              #   `pa.find_client`, `pa.compose`, `pa._NPM_AVAILABLE`—. Borrarlos
              #   rompe el backoffice en runtime con los tests en verde.
    "E501",      # 18 caso(s): linea de mas de 120. Sin fix automatico: hay que reescribirla.
    "E741",      # 10 caso(s): nombre de variable ambiguo (`l`, `I`, `O`). Renombrar a mano.
    "B905",      # 10 caso(s): `zip()` sin `strict=`.
    "E402",      # 7 caso(s): import que no esta arriba de todo. Suele ser a proposito
              #   (cargar algo antes de importar), asi que se mira caso por caso.
    "B007",      # 1 caso(s): variable del loop sin usar en el cuerpo.
]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo mide (90%, medido el 2026-09-03), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 88
