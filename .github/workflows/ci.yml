name: CI

on:
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 🔴 `-alpine`, la MISMA imagen que corren las tres instancias. No es
        # un detalle de tamaño: alpine ordena por bytes y la imagen Debian usa
        # el collation de la locale, así que un `ORDER BY` sobre texto puede
        # dar distinto en las dos. Un CI verde sobre otra imagen no dice nada
        # sobre producción.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libradesk
          POSTGRES_USER: libradesk
          POSTGRES_PASSWORD: libradesk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U libradesk -d libradesk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # La suite arma UNA BASE POR TEST, copiada de una plantilla, así que esta
      # URL es la de administración: el conftest le cambia el nombre de base
      # para crear y dropear. Apunta a `postgres` —la de mantenimiento— y no a
      # `libradesk`, porque no se puede dropear la base a la que uno está
      # conectado.
      #
      # Antes acá iba `LIBRADESK_POSTGRES_URL`, que la suite dejó de leer el
      # 2026-08-12 al pasar todo a la base por test. Ese desfasaje puso el CI
      # en rojo con la suite local en verde: el conftest aborta el import si
      # falta la variable, así que fallaban los 573 tests de una.
      LIBRADESK_SUITE_POSTGRES_URL: postgresql+psycopg://libradesk:libradesk-ci@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libraauth y libracore son repos privados, inalcanzables con el
      # GITHUB_TOKEN default (scopeado solo a este repo). Se accede con
      # deploy keys SSH de solo lectura, una por repo-motor, cuyas claves
      # privadas viven en los secrets de abajo.
      #
      # Por que deploy keys y no un PAT: un PAT vence sin aviso y tumba el
      # CI (y en el VPS tumbo un deploy real, incidente Restolibra del
      # 2026-07-25). Las deploy keys no vencen. Mismo mecanismo que ya usa
      # el VPS para las dependencias privadas de toda la familia.
      #
      # El alias `github-<repo>` con IdentitiesOnly no es adorno: con dos
      # claves cargadas, SSH las ofrece en orden y GitHub autentica con la
      # PRIMERA que acepta, que puede no ser la del repo que se esta
      # clonando -- una deploy key ES una identidad por repo. El alias
      # fuerza la correcta. Es el mismo error que ya se pago en el VPS.
      #
      # Estructura generalizada (misma que gestiolibra/medlibra/ventalibra):
      # agregar una dependencia privada nueva es una linea de `configurar`.
      - name: Configure SSH access to private Libra dependencies
        env:
          LIBRAAUTH_DEPLOY_KEY: ${{ secrets.LIBRAAUTH_DEPLOY_KEY }}
          LIBRACORE_DEPLOY_KEY: ${{ secrets.LIBRACORE_DEPLOY_KEY }}
          LIBRAGENDA_DEPLOY_KEY: ${{ secrets.LIBRAGENDA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          configurar() {
            repo=$1; clave=$2
            if [ -z "$clave" ]; then
              echo "::error::Falta el secret con la deploy key de $repo en este repositorio."
              echo "Sin el, pip no puede clonar $repo (repo privado) y el build falla."
              echo "Es la clave privada de una deploy key de solo lectura sobre marianocappucci/$repo."
              exit 1
            fi
            printf '%s\n' "$clave" > ~/.ssh/id_"$repo"
            chmod 600 ~/.ssh/id_"$repo"
            printf 'Host github-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_%s\n  IdentitiesOnly yes\n' \
              "$repo" "$repo" >> ~/.ssh/config
            git config --global \
              url."git@github-$repo:marianocappucci/$repo".insteadOf \
              "https://github.com/marianocappucci/$repo"
          }
          configurar libraauth "$LIBRAAUTH_DEPLOY_KEY"
          configurar libracore "$LIBRACORE_DEPLOY_KEY"
          configurar libragenda "$LIBRAGENDA_DEPLOY_KEY"

      # Confirma que cada clave autentica contra SU repo y no contra otro:
      # es exactamente el modo de fallar que motiva los alias de arriba, y
      # sin este paso recien se notaria dentro del pip install, como un
      # error de git que no dice cual de las dos claves se uso.
      - name: Verify each deploy key resolves to its own repo
        run: |
          for repo in libraauth libracore libragenda; do
            saludo=$(ssh -o StrictHostKeyChecking=yes -T "git@github-$repo" 2>&1 || true)
            echo "$repo -> $saludo"
            case "$saludo" in
              *"marianocappucci/$repo"*) ;;
              *) echo "::error::La deploy key de $repo no resuelve a marianocappucci/$repo."; exit 1 ;;
            esac
          done

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      # Lint antes que los tests: tarda segundos y su rojo se lee mucho mas
      # facil que el de una suite. El ruleset vive en pyproject.toml y esta
      # CURADO para dar cero hallazgos hoy en los 12 repos de la familia --
      # ver el comentario largo ahi. Un rojo aca es una regresion, no deuda.
      - name: Lint (ruff)
        run: ruff check .

      # `--cov` sin argumento toma el paquete de [tool.coverage.run] del
      # pyproject. El piso (fail_under) tambien esta ahi: es un trinquete
      # fijado 2 puntos debajo de lo medido el 2026-07-31, no una meta.
      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

      # El paso "Tests de shell" se fue el 2026-08-17, junto con
      # `scripts/deploy_cliente.sh`: era el unico shell del repo, y sus dos
      # tests cubrian dos funciones de ese script --a que servicio se le
      # reescribe la linea `image:`, y la poda de tags viejos--. Las dos cosas
      # las hace ahora `libracore.provisioning`, cubiertas en Python por
      # `test_pinear_el_servicio_de_la_app.py` y `test_panel_admin_poda.py`.
      #
      # 🔴 No se deja el paso "por si algun dia vuelve un .sh": tenia un guard
      # que ABORTA si el glob no matchea nada --puesto justamente para que
      # renombrar el directorio no lo dejara en verde corriendo cero tests--,
      # asi que sin tests de shell fallaria en cada corrida. Si vuelve un `.sh`,
      # vuelve el paso con su guard; esta en la historia de este archivo.

  # Los tests del frontend corren en su propio job: no comparten nada con
  # los de Python y asi el reporte dice cual de los dos fallo, en vez de un
  # unico job rojo. Sumado el 2026-07-31, junto con la primera suite de
  # frontend del producto.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `libra-ui` es un repo PRIVADO que se instala por git+https: sin
      # credenciales, `npm ci` falla al clonarlo. Se reusa la misma deploy
      # key que ya usa el Dockerfile, con el alias por repo de siempre.
      - name: Configurar acceso a libra-ui
        env:
          LIBRA_UI_DEPLOY_KEY: ${{ secrets.LIBRA_UI_DEPLOY_KEY }}
        run: |
          if [ -z "$LIBRA_UI_DEPLOY_KEY" ]; then
            echo "::error::Falta el secret LIBRA_UI_DEPLOY_KEY en este repositorio."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$LIBRA_UI_DEPLOY_KEY" > ~/.ssh/id_libra_ui
          chmod 600 ~/.ssh/id_libra_ui
          printf 'Host github-libra-ui\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/id_libra_ui\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global url."git@github-libra-ui:marianocappucci/libra-ui".insteadOf "https://github.com/marianocappucci/libra-ui"
          saludo=$(ssh -o StrictHostKeyChecking=yes -T git@github-libra-ui 2>&1 || true)
          echo "libra-ui -> $saludo"
          case "$saludo" in
            *"marianocappucci/libra-ui"*) ;;
            *) echo "::error::La deploy key no resuelve a marianocappucci/libra-ui."; exit 1 ;;
          esac
        working-directory: .

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # El build de produccion (`tsc -b && vite build`) es exactamente lo que
      # corre el Dockerfile en el deploy. Sin este paso, un error de tipos en
      # una pagina sin tests no aparecia hasta construir la imagen -- o sea,
      # durante el deploy y no en el CI.
      - name: Build de produccion
        run: npm run build

      # 🔴 No es redundante con el paso de arriba. `npm run build` devuelve 0
      # aunque `tsc -b` haya fallado con errores y no haya escrito `dist/`: sin
      # este chequeo el job queda verde habiendo producido nada, que es
      # exactamente lo que el paso de build tiene que impedir. Y `dist/` es lo
      # que el Dockerfile copia (`COPY --from=frontend-build /frontend/dist`),
      # asi que un build vacio se manifiesta recien en el deploy.
      - name: El build dejo algo de verdad
        run: test -f dist/index.html

      # `--reporter=default` mantiene la salida legible en el log; el `junit`
      # agregado deja además el XML que lee el gate del paso siguiente. Los dos
      # reporters conviven: el `--outputFile.junit` le da destino sólo al
      # segundo.
      - name: Correr los tests con cobertura
        run: |
          rm -f vitest.xml
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=vitest.xml

      # 🔑 Mismo patrón que el gate de concurrencia del job de backend, y por el
      # mismo motivo: que la suite haya CORRIDO no se deduce de que el paso
      # anterior haya salido en verde.
      #
      # 🔴 Lo que este gate agrega —y el exit code de `vitest run` NO cubre— son
      # los tests SALTEADOS. Medido el 2026-08-22 sobre vitest 3.2.7: un
      # `describe.skip` que envuelve la suite entera sale con **código 0**, así
      # que un módulo que se saltea completo deja el job igual de verde que uno
      # que corrió todo. Verificado en el CI real de LibraClub, que estrenó este
      # gate: con un módulo salteado el paso de tests queda en `success` y sólo
      # este paso lo pone en rojo.
      #
      # 🔴 `skipped` se cuenta por ocurrencias y no con `head -1`: el
      # `<testsuites>` raíz trae `tests`/`failures`/`errors` totales pero **no**
      # trae `skipped` — ese atributo vive en cada `<testsuite>`. Un `head -1`
      # leería el del primer archivo y daría por limpia una suite salteada más
      # abajo.
      #
      # `failures`/`errors` son hoy redundantes con el exit code de vitest (que
      # sí devuelve 1 con tests rojos — verificado con control positivo y
      # negativo por ocho vías el 2026-08-22). Se chequean igual porque salen
      # gratis del mismo XML y dejan de depender de que esa garantía siga
      # valiendo.
      - name: La suite de frontend corrio de verdad
        run: |
          test -f vitest.xml
          CORRIDOS=$(grep -o 'tests="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          FALLADOS=$(grep -o 'failures="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          ERRORES=$(grep -o 'errors="[0-9]*"' vitest.xml | head -1 | tr -dc '0-9')
          SALTEADOS=$(grep -o '<skipped/>' vitest.xml | wc -l)
          echo "frontend: $CORRIDOS corridos, $FALLADOS fallados, $ERRORES con error, $SALTEADOS salteados"
          test -n "$CORRIDOS"
          test "$CORRIDOS" -gt 0
          test "$FALLADOS" = "0"
          test "$ERRORES" = "0"
          test "$SALTEADOS" = "0"
