name: Deploy a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend
        run: |
          cd backend
          npm install
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync backend/dist al VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: backend/dist/
          remote_path: /root/soporte-neuroflow/backend/dist/
          remote_host: 149.50.136.218
          remote_port: 5384
          remote_user: root
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Sync backend/package*.json al VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: backend/package.json backend/package-lock.json
          remote_path: /root/soporte-neuroflow/backend/
          remote_host: 149.50.136.218
          remote_port: 5384
          remote_user: root
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Sync frontend/dist al VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: frontend/dist/
          remote_path: /root/soporte-neuroflow/frontend/dist/
          remote_host: 149.50.136.218
          remote_port: 5384
          remote_user: root
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Instalar deps produccion y reiniciar PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 149.50.136.218
          port: 5384
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -e
            cd /root/soporte-neuroflow/backend
            npm install --omit=dev
            pm2 restart soporte-neuroflow
            echo "Deploy OK: $(date)"
